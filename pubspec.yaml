name: eventku
description: Event booking application
version: 1.0.0+1

environment:
 sdk: ">=3.0.0 <4.0.0"

dependencies:
 flutter:
  sdk: flutter

 flutter_localizations:
  sdk: flutter

 # Firebase
 firebase_core: ^3.6.0
 firebase_auth: ^5.3.1
 cloud_firestore: ^5.4.4

 # State & local storage
 provider: ^6.1.2
 shared_preferences: ^2.2.3

 # UI
 cupertino_icons: ^1.0.6

dev_dependencies:
 flutter_test:
  sdk: flutter
 flutter_lints: ^5.0.0

 # Splash screen
 flutter_native_splash: ^2.4.7

 # App icon
 flutter_launcher_icons: ^0.14.4

flutter:
 uses-material-design: true

 assets:
  - assets/images/logo.png
  - assets/images/logo1.png

# ---------------- SPLASH SCREEN ----------------
flutter_native_splash:
 color: "#FFFFFF"
 image: assets/images/logo.png

 android: true
 ios: true

 android_12:
  color: "#FFFFFF"
  image: assets/images/logo.png

# ---------------- APP ICON ----------------
flutter_icons:
 android: true
 ios: true
 image_path: assets/images/logo.png
